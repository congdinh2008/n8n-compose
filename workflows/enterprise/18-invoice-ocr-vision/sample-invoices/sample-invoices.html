<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 mẫu hóa đơn OCR Vision</title>
  <style>
    :root {
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      background: #f3f4f6;
    }
    .page {
      width: 794px;
      min-height: 1123px;
      margin: 24px auto;
      padding: 48px;
      box-sizing: border-box;
      background: #fff;
      page-break-after: always;
      border: 1px solid #d1d5db;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 3px solid #1f2937;
      padding-bottom: 18px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .muted {
      color: #4b5563;
      line-height: 1.45;
    }
    .box {
      border: 1px solid #d1d5db;
      padding: 14px;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #e5e7eb;
    }
    .num {
      text-align: right;
      white-space: nowrap;
    }
    .totals {
      width: 360px;
      margin-left: auto;
      margin-top: 20px;
    }
    .totals td:first-child {
      font-weight: 700;
    }
    .grand {
      font-size: 18px;
      font-weight: 700;
      background: #fef3c7;
    }
    .footer {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      color: #374151;
    }
    @page {
      size: A4;
      margin: 0;
    }
    @media print {
      body { background: #fff; }
      .page {
        margin: 0;
        border: 0;
      }
      .page:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>
  <main id="invoices"></main>

          ['Bàn làm việc 120cm', 2, 1000000]

        payment: 'Chuyển khoản'
      }
    ];

    const fmt = value => value.toLocaleString('vi-VN') + ' VND';
    const root = document.getElementById('invoices');

    for (const inv of invoices) {
      const subtotal = inv.items.reduce((sum, row) => sum + row[1] * row[2], 0);
      const vat = Math.round(subtotal * 0.1);
      const total = subtotal + vat - inv.discount;
      const rows = inv.items.map((row, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${row[0]}</td>
          <td class="num">${row[1]}</td>
          <td class="num">${fmt(row[2])}</td>
          <td class="num">${fmt(row[1] * row[2])}</td>
        </tr>
      `).join('');

      root.insertAdjacentHTML('beforeend', `

          <div class="grid">

              <div class="muted">MST: ${inv.tax}</div>

            </div>
            <div class="box">
              <h2>Bên mua</h2>
              <div><strong>${inv.buyer}</strong></div>
              <div class="muted">MST: ${inv.buyerTax}</div>
              <div class="muted">Hình thức thanh toán: ${inv.payment}</div>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>STT</th>
                <th>Hàng hóa / Dịch vụ</th>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <table class="totals">
            <tr><td>Tạm tính</td><td class="num">${fmt(subtotal)}</td></tr>
            <tr><td>VAT 10%</td><td class="num">${fmt(vat)}</td></tr>
            <tr><td>Giảm giá</td><td class="num">${fmt(inv.discount)}</td></tr>
            <tr class="grand"><td>TỔNG THANH TOÁN</td><td class="num">${fmt(total)}</td></tr>
          </table>
          <div class="footer">
            <div>Người mua hàng<br><br><br>________________</div>
            <div>Người bán hàng<br><br><br>________________</div>
          </div>

    }
  </script>
</body>
</html>
